name: pull-request
on:
  pull_request:
    types: [opened, synchronize]
  merge_group:

jobs:
  code:
    uses: repobuddy/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      # Windows runs the test suite too: skill forwarders spawn npx through npx.cmd and cmd.exe
      # there (ADR-0022), and only a Windows run exercises that quoting for real. Being in this
      # matrix puts it inside the required `code / all-checks`.
      os: '["ubuntu-latest", "windows-latest"]'
      skip-playwright: true

  # This job proves the CLI runs on Windows, where an absolute path passed to `import()` crashes
  # Node's ESM loader (issue #250). The package's own plugin.json compiles skill scripts, so
  # `plugin build --check` exercises the build, the script compiler and the drift check end to end.
  # It sits outside the required `code / all-checks`, so it reports but does not gate a merge.
  windows-build:
    runs-on: windows-latest
    steps:
      # Keep LF on checkout, or every committed script reads as stale against the compiled output.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: repobuddy/.github/.github/actions/setup-node-pnpm@v2
      - run: pnpm install
      - run: pnpm --filter universal-plugin build
      - name: plugin build --check
        working-directory: packages/universal-plugin
        run: node bin/universal-plugin.mjs plugin build --check --root .
